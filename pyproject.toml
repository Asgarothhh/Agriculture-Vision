[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agriculture-vision-services"
version = "0.1.0"
description = "Agriculture Vision ML core and segmentation service"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"" = "app"

[tool.setuptools.packages.find]
where = ["app"]
include = ["ml_core*", "segmentation_service*"]
