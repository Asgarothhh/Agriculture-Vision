stages:
  - test
  - build
  - deploy

variables:
  KUBE_NAMESPACE: "ml-service"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# --- СТАДИЯ TEST ---
run-tests:
  stage: test
  script:
    - echo "Запуск юнит-тестов и проверки стиля кода..."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# --- СТАДИЯ BUILD ---
build-docker-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Авторизация в GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Сборка Docker-образа: $IMAGE_TAG"
    - docker build -t $IMAGE_TAG -t $CI_REGISTRY_IMAGE:latest .
    - echo "Публикация образа в реестр..."
    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "src/**/*"
        - "Dockerfile"
        - "requirements.txt"
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "src/**/*"
        - "Dockerfile"
        - "requirements.txt"

# --- СТАДИЯ DEPLOY ---
deploy-to-k8s:
  stage: deploy
  script:
    - echo "Подстановка актуального образа $IMAGE_TAG в манифест..."
    - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|g" k8s/deployment.yaml
    - echo "Применение манифестов в неймспейс $KUBE_NAMESPACE..."
    - kubectl apply -f k8s/namespace-and-quota.yaml
    - kubectl apply -f k8s/limit-range.yaml
    - kubectl apply -f k8s/deployment.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'