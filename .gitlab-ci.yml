stages:
  - test
  - build
  - deploy

variables:
  KUBE_NAMESPACE: "ml-service"
  API_IMAGE: "agriculture-vision-api"
  WORKER_IMAGE: "agriculture-vision-worker"

# --- СТАДИЯ TEST ---
unit-tests:
  stage: test
  script:
    - echo "Применение конфигурации из переменной ENV_FILE..."
    - cp $ENV_FILE .env
    - export $(grep -v '^#' .env | xargs)

    - echo "Запуск тестовых контейнеров (PostgreSQL/PostGIS + Redis)..."
    - docker rm -f test-postgres test-redis || true
    - docker run -d --name test-postgres -p 5432:5432 -e POSTGRES_USER=${POSTGRES_USER:-developer} -e POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME} -e POSTGRES_DB=${POSTGRES_DB:-agriculture-vision} postgis/postgis:15-3.4
    - docker run -d --name test-redis -p 6379:6379 redis:7-alpine
    - echo "Ожидание инициализации сервисов..."
    - sleep 5

    - echo "Подготовка Python-окружения..."
    - export GDAL_VERSION=$(gdal-config --version)
    - if [ ! -d ".venv" ]; then python3 -m venv .venv; fi
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

    - echo "Применение миграций Alembic и запуск автотестов..."
    - alembic upgrade head
    - pytest tests/

  after_script:
    - echo "Остановка и удаление тестовых контейнеров..."
    - docker rm -f test-postgres test-redis || true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# --- СТАДИЯ BUILD ---
build-images:
  stage: build
  script:
    - echo "Сборка Docker-образов API и Worker..."
    - docker build -f deploy/Dockerfile.api -t $API_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker build -f deploy/Dockerfile.worker -t $WORKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "Загрузка образов в Minikube..."
    - minikube image load $API_IMAGE:$CI_COMMIT_SHORT_SHA
    - minikube image load $WORKER_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "app/**/*"
        - "models/**/*"
        - "deploy/**/*"
        - "requirements.txt"
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "app/**/*"
        - "models/**/*"
        - "deploy/**/*"
        - "requirements.txt"

# --- СТАДИЯ DEPLOY ---
deploy-k8s:
  stage: deploy
  script:
    - echo "Применение конфигураций в неймспейс $KUBE_NAMESPACE..."
    - kubectl apply -f k8s/namespace-and-quota.yaml
    - kubectl apply -f k8s/limit-range.yaml
    - kubectl apply -f k8s/configmap.yaml

    - echo "Подстановка актуальных образов в манифесты..."
    - sed -i "s|API_IMAGE_PLACEHOLDER|$API_IMAGE:$CI_COMMIT_SHORT_SHA|g" k8s/api-deployment.yaml
    - sed -i "s|WORKER_IMAGE_PLACEHOLDER|$WORKER_IMAGE:$CI_COMMIT_SHORT_SHA|g" k8s/worker-deployment.yaml

    - echo "Применение деплойментов..."
    - kubectl apply -f k8s/api-deployment.yaml
    - kubectl apply -f k8s/worker-deployment.yaml

    - echo "Проверка статуса обновления..."
    - kubectl rollout status deployment/agriculture-vision-api -n $KUBE_NAMESPACE --timeout=120s
    - kubectl rollout status deployment/agriculture-vision-worker -n $KUBE_NAMESPACE --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'