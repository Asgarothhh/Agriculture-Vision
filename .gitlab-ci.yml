stages:
  - build
  - deploy

variables:
  KUBE_NAMESPACE: "ml-service"
  API_IMAGE: "agriculture-vision-api"
  WORKER_IMAGE: "agriculture-vision-worker"
  NGINX_IMAGE: "agriculture-vision-nginx"

build-images:
  stage: build
  needs: []
  cache:
    key: agrovision-model-weights
    paths:
      - config/yolo_best.pt
      - config/segformer_best.pt
    policy: pull-push
  script:
    - minikube status || minikube start --driver=docker --memory=8192 --cpus=4 || (minikube delete --all && minikube start --driver=docker --memory=8192 --cpus=4)
    - eval "$(minikube docker-env)"
    - bash deploy/prepare-weights.sh
    - docker build -f deploy/Dockerfile.api -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker build -f deploy/Dockerfile.worker -t "$WORKER_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker build -f deploy/Dockerfile.nginx --no-cache --build-arg CI_COMMIT_SHORT_SHA="$CI_COMMIT_SHORT_SHA" -t "$NGINX_IMAGE:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "app/**/*"
        - "frontend/**/*"
        - "models/**/*"
        - "deploy/**/*"
        - "k8s/**/*"
        - "requirements.txt"
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "app/**/*"
        - "frontend/**/*"
        - "models/**/*"
        - "deploy/**/*"
        - "k8s/**/*"
        - "requirements.txt"

deploy-k8s:
  stage: deploy
  needs: ["build-images"]
  script:
    - kubectl apply -f k8s/namespace-and-quota.yaml
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/postgres.yaml
    - kubectl apply -f k8s/redis.yaml
    - kubectl rollout status deployment/postgres-deployment -n "$KUBE_NAMESPACE" --timeout=180s
    - tmpdir="$(mktemp -d)"
    - sed "s|API_IMAGE_PLACEHOLDER|$API_IMAGE:$CI_COMMIT_SHORT_SHA|g" k8s/api-deployment.yaml > "$tmpdir/api.yaml"
    - sed "s|WORKER_IMAGE_PLACEHOLDER|$WORKER_IMAGE:$CI_COMMIT_SHORT_SHA|g" k8s/worker-deployment.yaml > "$tmpdir/worker.yaml"
    - sed "s|NGINX_IMAGE_PLACEHOLDER|$NGINX_IMAGE:$CI_COMMIT_SHORT_SHA|g; s|GIT_SHA_PLACEHOLDER|$CI_COMMIT_SHORT_SHA|g" k8s/nginx.yaml > "$tmpdir/nginx.yaml"
    - kubectl apply -f "$tmpdir/api.yaml"
    - kubectl apply -f "$tmpdir/worker.yaml"
    - kubectl apply -f "$tmpdir/nginx.yaml"
    - kubectl rollout restart deployment/agriculture-vision-nginx -n "$KUBE_NAMESPACE"
    - kubectl rollout status deployment/agriculture-vision-api -n "$KUBE_NAMESPACE" --timeout=300s
    - kubectl rollout status deployment/agriculture-vision-worker -n "$KUBE_NAMESPACE" --timeout=180s
    - kubectl rollout status deployment/agriculture-vision-nginx -n "$KUBE_NAMESPACE" --timeout=120s
    - kubectl get pods -n "$KUBE_NAMESPACE" -o wide
    - kubectl get svc -n "$KUBE_NAMESPACE"
    - chmod +x deploy/refresh-host-nginx.sh
    - bash deploy/refresh-host-nginx.sh
    - curl -sf "http://127.0.0.1/api/v1/health"
    - |
      code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1/api/v1/auth/login -H 'Content-Type: application/json' -d '{}' || true)"
      echo "login $code"
      test "$code" != "502" -a "$code" != "000"
  after_script:
    - echo "=== ОТЛАДОЧНАЯ ИНФОРМАЦИЯ ПРИ ОШИБКЕ ==="
    - kubectl get pods -n "$KUBE_NAMESPACE" -l app=agri-worker
    - kubectl describe pods -n "$KUBE_NAMESPACE" -l app=agri-worker
    - kubectl logs -n "$KUBE_NAMESPACE" -l app=agri-worker --all-containers=true --tail=100 || true

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
