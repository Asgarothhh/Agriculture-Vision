apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriculture-vision-nginx
  namespace: ml-service
  labels:
    app: agri-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agri-nginx
  template:
    metadata:
      labels:
        app: agri-nginx
      annotations:
        agriculture-vision/git-sha: GIT_SHA_PLACEHOLDER
    spec:
      containers:
        - name: nginx
          image: NGINX_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agri-nginx-service
  namespace: ml-service
spec:
  type: NodePort
  selector:
    app: agri-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
