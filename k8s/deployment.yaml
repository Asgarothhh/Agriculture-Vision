apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriculture-vision-api
  namespace: ml-service
  labels:
    app: agriculture-vision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agriculture-vision
  template:
    metadata:
      labels:
        app: agriculture-vision
    spec:
      containers:
        - name: fastapi-ml-container
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3