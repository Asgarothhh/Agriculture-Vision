apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:15-3.4
          env:
            - name: POSTGRES_DB
              value: "agriculture-vision"
            - name: POSTGRES_USER
              value: "developer"
            - name: POSTGRES_PASSWORD
              value: "developer"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "developer", "-d", "agriculture-vision"]
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "developer", "-d", "agriculture-vision"]
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ml-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432