apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriculture-vision-worker
  namespace: ml-service
  labels:
    app: agri-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agri-worker
  template:
    metadata:
      labels:
        app: agri-worker
    spec:
      containers:
        - name: celery-worker
          image: WORKER_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agri-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config-volume
          hostPath:
            path: /var/agriculture-vision/config
            type: DirectoryOrCreate