apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriculture-vision-worker
  namespace: ml-service
  labels:
    app: agri-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agri-worker
  template:
    metadata:
      labels:
        app: agri-worker
    spec:
      containers:
        - name: celery-worker
          image: WORKER_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.tasks_service.celery_app", "worker", "-l", "info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: agri-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"