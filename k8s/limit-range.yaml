apiVersion: v1
kind: LimitRange
metadata:
  name: ml-service-limits
  namespace: ml-service
spec:
  limits:
  - type: Container
    default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: "500m"
      memory: 1Gi
    max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: "100m"
      memory: 256Mi