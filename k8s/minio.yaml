---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: ml-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
  namespace: ml-service
spec:
  replicas: 1
  # One MinIO per ReadWriteOnce volume: stop the old pod before starting the new one.
  strategy:
    type: Recreate
    # The live object still carries RollingUpdate defaults; without this null,
    # kubectl apply rejects the switch ("rollingUpdate: Forbidden").
    rollingUpdate: null
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: minio
          # Official minio/minio was removed from Docker Hub. quay.io/minio/minio
          # rejects anonymous pulls. bitnami/minio:latest has no manifest.
          # This legacy tag is still anonymously pullable and speaks the S3 API.
          image: bitnamilegacy/minio:2025.7.23
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin"
            - name: MINIO_DEFAULT_BUCKETS
              value: "agrovision"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-storage
              mountPath: /bitnami/minio/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ml-service
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console