# Host nginx on :80 (the address used for remote access).
# It does not serve files from its own disk: CI never updates them, so a static
# root here kept an outdated SPA in front of a new API. Everything goes to the
# nginx inside the cluster (NodePort 30080), which is rebuilt on every deploy and
# itself serves the SPA, /api/ and /basemap/esri/.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 512m;

    location / {
        proxy_pass __WEB_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
