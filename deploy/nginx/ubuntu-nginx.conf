# Full /etc/nginx/nginx.conf for hosts whose nginx.conf does not include
# sites-enabled/ or conf.d/. Same routing as ubuntu-host.conf: everything goes to
# the cluster nginx (NodePort 30080), which serves the SPA of the deployed commit,
# /api/ and /basemap/esri/. See deploy/refresh-host-nginx.sh.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 512m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / {
            proxy_pass __WEB_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }
    }
}
