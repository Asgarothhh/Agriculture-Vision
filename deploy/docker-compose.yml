services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agriculture-vision}
      POSTGRES_USER: ${POSTGRES_USER:-developer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-developer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-developer} -d ${POSTGRES_DB:-agriculture-vision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-agrovision};
      exit 0;
      "

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-byte-aes-key-please!!}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-developer}:${POSTGRES_PASSWORD:-developer}@db:5432/${POSTGRES_DB:-agriculture-vision}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-developer}:${POSTGRES_PASSWORD:-developer}@db:5432/${POSTGRES_DB:-agriculture-vision}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-agrovision}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      YOLO_WEIGHTS_PATH: /app/config/yolo_best.pt
      SEGFORMER_WEIGHTS_PATH: /app/config/segformer_best.pt
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
    volumes:
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-byte-aes-key-please!!}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-developer}:${POSTGRES_PASSWORD:-developer}@db:5432/${POSTGRES_DB:-agriculture-vision}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-developer}:${POSTGRES_PASSWORD:-developer}@db:5432/${POSTGRES_DB:-agriculture-vision}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-agrovision}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      YOLO_WEIGHTS_PATH: /app/config/yolo_best.pt
      SEGFORMER_WEIGHTS_PATH: /app/config/segformer_best.pt
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
    volumes:
      - ../config:/app/config:ro
    depends_on:
      - api
      - redis

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - api

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    profiles: ["flower"]

volumes:
  pgdata:
  miniodata:
